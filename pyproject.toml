[project]
name = "planeat-backend"
version = "0.1.0"
description = "FastAPI backend for PlanEat"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "chromadb>=0.5,<1.0",
    "langchain-core>=0.3,<1.0",
    "langgraph>=0.2,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
    "openai>=3.23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
